name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Queue releases rather than cancelling an upload in progress.
concurrency:
  group: native-markdown-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -p test_release.py
      - name: Detect version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: python -B scripts/release.py detect

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Select Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test
        env:
          APPDATA: ${{ runner.temp }}/native-markdown-test-appdata
          LOCALAPPDATA: ${{ runner.temp }}/native-markdown-test-localappdata
        run: cargo +stable test --locked --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo +stable build --release --locked --target x86_64-pc-windows-msvc
      - name: Collect app-local Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Visual C++ tools not found' }
          $runtime = Get-ChildItem "$installation/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (!$runtime) { throw 'Visual C++ redistributable DLLs not found' }
          "RELEASE_RUNTIME=$($runtime.FullName)" >> $env:GITHUB_ENV
      - name: Package portable ZIP
        run: python -B scripts/release.py package --binary target/x86_64-pc-windows-msvc/release/native-markdown.exe --runtime-dir "$env:RELEASE_RUNTIME" --output target/release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: target/release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/release.py publish --output target/release-assets
