[package]
name = "native-markdown"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = { version = "=0.10.0", features = ["tree-sitter-markdown"] }
pulldown-cmark = "0.12"
rfd = "0.15"
tempfile = "3.12"

[target.'cfg(windows)'.dependencies]
wry = "=0.57.3"
ammonia = "4"
serde_json = "1"
percent-encoding = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[build-dependencies]
winresource = "0.1.31"
