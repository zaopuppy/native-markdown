[package]
name = "native-markdown"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui_http_client = "0.2.2"
image = { version = "0.25.10", default-features = false }
pulldown-cmark = "0.12"
rfd = "0.15"
smol = "2"
tempfile = "3.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[build-dependencies]
winresource = "0.1.31"
